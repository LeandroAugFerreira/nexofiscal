name: Testes da cópia fonte
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalar API, interface e Chromium isolados
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          npm --prefix frontend ci
      - name: Validar login e Central com dados fictícios
        run: python infrastructure/browser_smoke_recruiting.py
      - name: Salvar capturas sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexofiscal-browser-recruiting
          path: artifacts/browser/*.png
          if-no-files-found: ignore
          retention-days: 7
