name: fitnota
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitnota}
      POSTGRES_USER: ${POSTGRES_USER:-fitnota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fitnota}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fitnota}
      TZ: America/Sao_Paulo
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/fitnota-payment
      N8N_HEALTH_URL: http://n8n:5678/healthz
    ports: ['127.0.0.1:${BACKEND_PORT:-8010}:8000']
    networks: [database, application]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:${FRONTEND_PORT:-8080}:8080']
    networks: [application]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports: ['127.0.0.1:${N8N_PORT:-5678}:5678']
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure N8N_ENCRYPTION_KEY no .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes: [n8n_data:/home/node/.n8n]
    networks: [application]
    restart: unless-stopped
volumes:
  postgres_data:
  n8n_data:
networks:
  database: {internal: true}
  application: {}
